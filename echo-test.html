<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OurBackyard PoC - Echo Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
           background: #1a1a2e; color: #eee; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { color: #00d9ff; margin-bottom: 10px; font-size: 1.5rem; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    .status.connecting { background: #ff9800; }
    .status.connected { background: #4caf50; }
    .status.disconnected { background: #f44336; }
    .info { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
    .info code { background: #0f3460; padding: 2px 6px; border-radius: 4px; color: #00d9ff; }
    button { background: #00d9ff; color: #1a1a2e; border: none; padding: 12px 24px; 
             border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; width: 100%; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #messages { background: #16213e; border-radius: 8px; height: 250px; overflow-y: auto; 
                padding: 10px; margin: 15px 0; }
    .msg { padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 14px; }
    .msg.sent { background: #0f3460; margin-left: 20%; }
    .msg.received { background: #1f4068; margin-right: 20%; }
    .msg.system { background: #333; text-align: center; font-size: 12px; }
    .msg.error { background: #f44336; text-align: center; }
    input { width: 100%; padding: 12px; border: none; border-radius: 8px; 
            background: #16213e; color: #fff; margin-bottom: 10px; }
    .hidden { display: none; }
    #log { font-size: 12px; color: #888; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>🏡 OurBackyard PoC</h1>
  <p style="color:#888;font-size:12px;margin-bottom:15px;">Testing with public echo server</p>
  
  <div id="status" class="status disconnected">🔴 Disconnected</div>
  <div id="log"></div>
  
  <div class="info">
    <strong>Server:</strong> <code>wss://echo.websocket.org</code><br>
    <strong>Peer ID:</strong> <code id="peer-id">-</code>
  </div>

  <button id="btn-join">Connect to Echo Server</button>

  <div id="app" class="hidden">
    <div id="messages"></div>
    <input type="text" id="input-msg" placeholder="Type a message...">
    <button id="btn-send">Send Message</button>
  </div>

  <script>
    const peerId = 'peer_' + Math.random().toString(36).substr(2, 9);
    document.getElementById('peer-id').textContent = peerId;

    let ws = null;
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const messagesEl = document.getElementById('messages');
    const btnJoin = document.getElementById('btn-join');
    const btnSend = document.getElementById('btn-send');
    const inputMsg = document.getElementById('input-msg');

    function log(msg) {
      logEl.textContent = msg;
      console.log(msg);
    }

    function updateStatus(state, text) {
      statusEl.className = 'status ' + state;
      statusEl.textContent = text;
    }

    function addMsg(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    btnJoin.addEventListener('click', () => {
      log('Connecting to echo.websocket.org...');
      updateStatus('connecting', '🟡 Connecting...');
      
      ws = new WebSocket('wss://echo.websocket.org');
      
      ws.onopen = () => {
        log('Connected!');
        updateStatus('connected', '🟢 Connected!');
        btnJoin.disabled = true;
        btnJoin.textContent = 'Connected!';
        document.getElementById('app').classList.remove('hidden');
        addMsg('Connected to echo server. Send a message to test!', 'system');
      };
      
      ws.onmessage = (e) => {
        log('Received: ' + e.data);
        addMsg('Echo: ' + e.data, 'received');
      };
      
      ws.onerror = (e) => {
        log('Error: ' + e.type);
        updateStatus('disconnected', '🔴 Error');
        addMsg('Connection error', 'error');
      };
      
      ws.onclose = (e) => {
        log('Closed: ' + e.code + ' - ' + e.reason);
        updateStatus('disconnected', '🔴 Disconnected');
        addMsg('Connection closed', 'error');
      };
    });

    btnSend.addEventListener('click', () => {
      const text = inputMsg.value.trim();
      if (text && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(text);
        addMsg('You: ' + text, 'sent');
        inputMsg.value = '';
      }
    });

    inputMsg.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnSend.click();
    });

    log('Click Connect to test WebSocket.');
  </script>
</body>
</html>
