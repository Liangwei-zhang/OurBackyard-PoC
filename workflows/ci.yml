name: CI — SDK Tests

on:
  push:
    branches: [master]
    paths:
      - 'sdk/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'sdk/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run SDK tests
        run: node --test sdk/tests/*.test.js

  lint-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax (all SDK source files)
        run: |
          find sdk/src -name '*.js' -exec node --check {} +
          echo "All SDK source files have valid syntax"

      - name: Check test file syntax
        run: |
          find sdk/tests -name '*.test.js' -exec node --check {} +
          echo "All test files have valid syntax"
