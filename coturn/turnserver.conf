# Coturn TURN Server Configuration
# OurBackyard - P2P Local Community App

# 監聽端口
listening-port=3478
tls-listening-port=5349

# 中繼端口範圍
min-port=49152
max-port=65535

# 認證機制（默認：靜態用戶名/密碼，便於快速部署驗證）
lt-cred-mech
user=turnuser:turnpassword123
# 如果要切到 REST API 動態密碼，註釋掉 lt-cred-mech/user，並打開下面兩行：
# use-auth-secret
# static-auth-secret=REPLACE_WITH_STRONG_SECRET_FROM_ENV

# Realm
realm=ourbackyard.local

# 證書路徑 (需要替換為真實證書)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/pkey.pem

# STUN 配置
# stun-only option 是可選的 - 打開後只做 STUN 不做 TURN
# no-stun

# 日誌
log-file=/var/log/coturn/turnserver.log
# no-stdout-log

# 安全性
# no-multicast-peers
# deny-unknow-peers

# 性能優化
# 員工線程數，建議設為 CPU 核心數
# proc-num=4

# 持久化用戶數據庫（可選）
# userdb=/etc/coturn/turnuserdb.txt

# 基礎互通配置
fingerprint
stale-nonce
no-loopback-peers

# TURN REST API (用於動態密碼生成)
# 詳見: https://github.com/coturn/coturn/wiki/TURN-REST-API
# turn-rest-api-enabled
# secret=your-static-secret

# 華為雲/Oracle Cloud ARM 優化
# stale-nonce
# max-bps=0
# bps-capacity=0
