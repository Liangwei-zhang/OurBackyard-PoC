<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OurBackyard - P2P Local Community</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
           background: #1a1a2e; color: #eee; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { color: #00d9ff; margin-bottom: 10px; font-size: 1.5rem; }
    h2 { color: #ff6b6b; margin: 15px 0 10px; font-size: 1.1rem; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    .status.connecting { background: #ff9800; }
    .status.connected { background: #4caf50; }
    .status.disconnected { background: #f44336; }
    .info { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
    .info code { background: #0f3460; padding: 2px 6px; border-radius: 4px; color: #00d9ff; }
    .turn-config { background: #1f4068; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; }
    button { background: #00d9ff; color: #1a1a2e; border: none; padding: 12px 24px; 
             border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; width: 100%; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #4caf50; }
    button.danger { background: #ff6b6b; }
    #messages { background: #16213e; border-radius: 8px; height: 300px; overflow-y: auto; 
                padding: 10px; margin: 15px 0; }
    .msg { padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 14px; }
    .msg.sent { background: #0f3460; margin-left: 20%; }
    .msg.received { background: #1f4068; margin-right: 20%; }
    .msg.system { background: #333; text-align: center; font-size: 12px; }
    .msg.error { background: #f44336; text-align: center; }
    .msg.p2p { background: #6a1b9a; border: 1px solid #9c27b0; }
    .msg.gundb { background: #1b5e20; border: 1px solid #4caf50; }
    input { width: 100%; padding: 12px; border: none; border-radius: 8px; 
            background: #16213e; color: #fff; margin-bottom: 10px; }
    .hidden { display: none; }
    #log { font-size: 12px; color: #888; margin-bottom: 10px; max-height: 60px; overflow-y: auto; }
    .mode-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; margin-left: 10px; }
    .mode-signal { background: #ff9800; color: #000; }
    .mode-p2p { background: #4caf50; color: #fff; }
    .mode-turn { background: #e91e63; color: #fff; }
    .peer-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .peer-tag { background: #0f3460; padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; }
    .peer-tag:hover { background: #00d9ff; color: #1a1a2e; }
    .peer-tag.connected { border: 2px solid #4caf50; }
    #location-data { font-size: 11px; color: #888; margin-top: 5px; }
    .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 10px; background: #16213e; border: none; border-radius: 8px; color: #888; cursor: pointer; }
    .tab.active { background: #00d9ff; color: #1a1a2e; }
  </style>
</head>
<body>
  <h1>🏡 OurBackyard <span id="mode-badge" class="mode-badge mode-signal">Signal Server</span></h1>
  
  <div id="status" class="status disconnected">🔴 Disconnected</div>
  <div id="log"></div>
  
  <div class="turn-config hidden" id="turn-config">
    <strong>🌐 TURN:</strong> <span id="turn-status">Loading...</span>
  </div>
  
  <div class="info">
    <strong>Room:</strong> <code id="room-id">ourbackyard-calgary-test</code><br>
    <strong>Peer ID:</strong> <code id="peer-id">-</code>
    <div id="location-data"></div>
  </div>

  <div id="setup">
    <input type="text" id="input-room" placeholder="Room ID (optional)" value="ourbackyard-calgary-test">
    <input type="text" id="input-name" placeholder="Your Display Name">
    <button id="btn-join">Join as Host</button>
    <button id="btn-join-guest" class="secondary">Join as Guest</button>
  </div>

  <div id="app" class="hidden">
    <div class="tab-bar">
      <button class="tab active" id="tab-chat">💬 Chat</button>
      <button class="tab" id="tab-peers">👥 Neighbors</button>
    </div>
    
    <div id="view-chat">
      <div id="messages"></div>
      <input type="text" id="input-msg" placeholder="Type a message...">
      <button id="btn-send">Send via P2P</button>
    </div>
    
    <div id="view-peers" class="hidden">
      <h2>Nearby Neighbors</h2>
      <div id="peer-list" class="peer-list"></div>
      <button id="btn-refresh-peers" class="secondary">🔄 Refresh</button>
    </div>
  </div>

  <!-- GunDB from CDN -->
  <script src="https://gun-manual.herokuapp.com/gun.js"></script>
  
  <script>
    // ============ 全域變量 ============
    const peerId = 'peer_' + Math.random().toString(36).substr(2, 9);
    let displayName = '';
    let roomId = 'ourbackyard-calgary-test';
    let isHost = false;
    let mode = 'signal'; // 'signal', 'p2p', 'turn'
    let iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ];

    // WebRTC
    let ws = null;
    let peerConnections = {}; // peerId -> RTCPeerConnection
    let dataChannels = {};   // peerId -> RTCDataChannel
    
    // GunDB
    let gun = Gun(['https://gun-manual.herokuapp.com/gun']);
    
    // DOM 元素
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const modeBadgeEl = document.getElementById('mode-badge');
    const messagesEl = document.getElementById('messages');
    const btnJoin = document.getElementById('btn-join');
    const btnJoinGuest = document.getElementById('btn-join-guest');
    const btnSend = document.getElementById('btn-send');
    const inputMsg = document.getElementById('input-msg');
    const inputRoom = document.getElementById('input-room');
    const inputName = document.getElementById('input-name');
    const peerListEl = document.getElementById('peer-list');

    // ============ 初始化 ============
    document.getElementById('peer-id').textContent = peerId;
    inputRoom.value = roomId;

    // 嘗試獲取地理位置
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          document.getElementById('location-data').innerHTML = 
            `📍 ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          
          // 存儲到 GunDB
          gun.get('user:' + peerId).put({
            id: peerId,
            displayName: displayName,
            location: { lat: latitude, lng: longitude },
            updatedAt: Date.now()
          });
        },
        (err) => {
          document.getElementById('location-data').textContent = '📍 Location unavailable';
        },
        { timeout: 5000 }
      );
    }

    // ============ 日誌函數 ============
    function log(msg) {
      const line = document.createElement('div');
      line.textContent = '> ' + msg;
      line.style.cssText = 'font-size:11px;color:#666;margin:2px 0;';
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log('[OurBackyard]', msg);
    }

    function updateStatus(state, text) {
      statusEl.className = 'status ' + state;
      statusEl.textContent = text;
    }

    function updateMode(newMode) {
      mode = newMode;
      let modeText = mode;
      if (mode === 'p2p') modeText = 'P2P Direct';
      else if (mode === 'turn') modeText = 'TURN Relay';
      else modeText = 'Signal Server';
      
      modeBadgeEl.className = 'mode-badge ' + 
        (mode === 'p2p' ? 'mode-p2p' : mode === 'turn' ? 'mode-turn' : 'mode-signal');
      modeBadgeEl.textContent = modeText;
    }

    function addMsg(text, type = 'system') {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ============ GunDB 函數 ============
    function saveToGunDB(type, data) {
      const key = `${type}:${Date.now()}`;
      gun.get(key).put(data);
      log(`Saved to GunDB: ${type}`);
    }

    function loadFromGunDB(callback) {
      gun.get('messages').map().once((data, key) => {
        if (data) callback(data);
      });
    }

    // ============ WebRTC 函數 ============
    function createPeerConnection(targetPeerId, isInitiator = false) {
      log(`Creating RTC connection to ${targetPeerId} (initiator: ${isInitiator})`);
      
      const pc = new RTCPeerConnection({ 
        iceServers: iceServers 
      });
      
      peerConnections[targetPeerId] = pc;

      pc.onicecandidate = (e) => {
        if (e.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            candidate: e.candidate,
            target: targetPeerId,
            roomId: roomId
          }));
        }
      };

      pc.onconnectionstatechange = () => {
        const state = pc.connectionState;
        log(`RTC to ${targetPeerId}: ${state}`);
        
        if (state === 'connected') {
          updateStatus('connected', '🟢 P2P Connected!');
          if (mode !== 'p2p') updateMode('p2p');
          
          // 更新 UI
          document.querySelectorAll('.peer-tag').forEach(tag => {
            if (tag.dataset.peer === targetPeerId) {
              tag.classList.add('connected');
            }
          });
        } else if (state === 'disconnected' || state === 'failed') {
          updateMode('signal');
        }
      };

      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        log(`ICE to ${targetPeerId}: ${state}`);
        
        if (state === 'new' || state === 'checking') {
          updateMode('turn'); // 正在嘗試 TURN
        }
      };

      // 創建 Data Channel
      if (isInitiator) {
        const dc = pc.createDataChannel('data', { ordered: true });
        setupDataChannel(dc, targetPeerId);
        
        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
          log(`Sending offer to ${targetPeerId}`);
          ws.send(JSON.stringify({
            type: 'offer',
            sdp: pc.localDescription,
            target: targetPeerId,
            roomId: roomId
          }));
        });
      } else {
        pc.ondatachannel = (e) => {
          setupDataChannel(e.channel, targetPeerId);
        };
      }

      return pc;
    }

    function setupDataChannel(dc, targetPeerId) {
      dataChannels[targetPeerId] = dc;
      
      dc.onopen = () => {
        log(`Data channel open with ${targetPeerId}!`);
        addMsg(`🔗 P2P connected with ${targetPeerId}`, 'system');
      };
      
      dc.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          addMsg(`${msg.from}: ${msg.text}`, 'p2p');
          
          // 同步到 GunDB
          saveToGunDB('message', msg);
        } catch (err) {
          addMsg(`P2P: ${e.data}`, 'p2p');
        }
      };

      dc.onerror = (e) => {
        log(`Data channel error with ${targetPeerId}`);
      };
    }

    // ============ WebSocket 處理 ============
    function handleWSMessage(data) {
      try {
        const msg = JSON.parse(data);
        
        switch (msg.type) {
          case 'sys':
            addMsg(msg.msg, 'system');
            if (msg.turn) {
              // 配置 TURN 服務器
              document.getElementById('turn-config').classList.remove('hidden');
              if (msg.turn.turn && msg.turn.turn.length > 0) {
                iceServers = [
                  ...iceServers,
                  { 
                    urls: msg.turn.turn[0], 
                    username: msg.turn.username, 
                    credential: msg.turn.credential 
                  }
                ];
                document.getElementById('turn-status').textContent = '✅ Configured';
                log('TURN server configured: ' + msg.turn.turn[0]);
              } else {
                document.getElementById('turn-status').textContent = '⚠️ Not configured (STUN only)';
              }
            }
            break;
            
          case 'peer-joined':
            log(`${msg.peerId} joined the room`);
            addMsg(`👋 ${msg.peerId} joined`, 'system');
            updatePeerList();
            
            // 如果是 Host，主動創建連接
            if (isHost) {
              setTimeout(() => createPeerConnection(msg.peerId, true), 1000);
            }
            break;
            
          case 'peer-left':
            log(`${msg.peerId} left the room`);
            addMsg(`👋 ${msg.peerId} left`, 'system');
            cleanupPeer(msg.peerId);
            updatePeerList();
            break;
            
          case 'offer':
            log(`Received offer from ${msg.from}`);
            createPeerConnection(msg.from, false);
            peerConnections[msg.from].setRemoteDescription(msg.sdp);
            peerConnections[msg.from].createAnswer().then(a => {
              peerConnections[msg.from].setLocalDescription(a);
              ws.send(JSON.stringify({
                type: 'answer',
                sdp: a,
                target: msg.from,
                roomId: roomId
              }));
            });
            break;
            
          case 'answer':
            log(`Received answer from ${msg.from}`);
            peerConnections[msg.from].setRemoteDescription(msg.sdp);
            break;
            
          case 'ice-candidate':
            if (peerConnections[msg.from] && msg.candidate) {
              peerConnections[msg.from].addIceCandidate(msg.candidate);
            }
            break;
            
          case 'peers':
            log(`Room has ${msg.peers.length} peers`);
            updatePeerListUI(msg.peers);
            break;
            
          case 'text':
            addMsg(`${msg.from}: ${msg.content}`, 'received');
            break;
        }
      } catch (err) {
        log('Parse error: ' + err);
      }
    }

    function cleanupPeer(peerId) {
      if (peerConnections[peerId]) {
        peerConnections[peerId].close();
        delete peerConnections[peerId];
      }
      if (dataChannels[peerId]) {
        delete dataChannels[peerId];
      }
    }

    // ============ 連接函數 ============
    function connectToSignal(asHost) {
      isHost = asHost;
      displayName = inputName.value || peerId;
      roomId = inputRoom.value || 'ourbackyard-calgary-test';
      
      log(`Connecting to signal server as ${asHost ? 'Host' : 'Guest'}...`);
      updateStatus('connecting', '🟡 Connecting to Signal Server...');
      
      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${location.host}/ws/${roomId}`;
      log('WS: ' + wsUrl);
      
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        log('Connected to signal server!');
        updateStatus('connected', '🟢 Signal Server Connected');
        btnJoin.disabled = true;
        btnJoinGuest.disabled = true;
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        
        // 保存用戶信息到 GunDB
        gun.get('user:' + peerId).put({
          id: peerId,
          displayName: displayName,
          roomId: roomId,
          updatedAt: Date.now()
        });
        
        // 獲取房間內的 peer 列表
        setTimeout(() => {
          ws.send(JSON.stringify({ type: 'get-peers', roomId: roomId }));
        }, 500);
        
        if (!asHost) {
          addMsg('Connected! Waiting for host to create P2P connection...', 'system');
        }
      };
      
      ws.onmessage = (e) => handleWSMessage(e.data);
      
      ws.onerror = (e) => {
        log('WS Error!');
        updateStatus('disconnected', '🔴 Connection Failed');
      };
      
      ws.onclose = (e) => {
        log('WS Closed: ' + e.code);
        updateStatus('disconnected', '🔴 Disconnected');
      };
    }

    // ============ UI 函數 ============
    function updatePeerList() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'get-peers', roomId: roomId }));
      }
    }

    function updatePeerListUI(peers) {
      peerListEl.innerHTML = '';
      
      peers.forEach(p => {
        if (p === peerId) return;
        
        const tag = document.createElement('span');
        tag.className = 'peer-tag';
        tag.dataset.peer = p;
        tag.textContent = p.substring(0, 12) + '...';
        tag.onclick = () => connectToPeer(p);
        peerListEl.appendChild(tag);
      });
      
      if (peers.length === 0) {
        peerListEl.innerHTML = '<div style="color:#666;font-size:13px;">No neighbors yet</div>';
      }
    }

    function connectToPeer(targetPeerId) {
      if (peerConnections[targetPeerId]) {
        log(`Already connecting to ${targetPeerId}`);
        return;
      }
      
      createPeerConnection(targetPeerId, true);
    }

    function sendMessage(text) {
      const msg = { from: peerId, text: text, timestamp: Date.now() };
      
      // 嘗試通過 P2P 發送
      let sent = false;
      for (const [targetPeerId, dc] of Object.entries(dataChannels)) {
        if (dc.readyState === 'open') {
          dc.send(JSON.stringify(msg));
          addMsg(`You (P2P): ${text}`, 'sent');
          sent = true;
        }
      }
      
      // 如果沒有 P2P 連接，通過 Signal Server
      if (!sent && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ 
          type: 'text', 
          content: text, 
          roomId: roomId 
        }));
        addMsg(`You (Signal): ${text}`, 'sent');
      } else if (!sent) {
        addMsg('Not connected!', 'error');
      }
      
      // 保存到 GunDB
      saveToGunDB('message', msg);
    }

    // ============ 按鈕事件 ============
    btnJoin.addEventListener('click', () => connectToSignal(true));
    btnJoinGuest.addEventListener('click', () => connectToSignal(false));

    btnSend.addEventListener('click', () => {
      const text = inputMsg.value.trim();
      if (!text) return;
      sendMessage(text);
      inputMsg.value = '';
    });

    inputMsg.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') btnSend.click();
    });

    // Tab 切換
    document.getElementById('tab-chat').addEventListener('click', () => {
      document.getElementById('tab-chat').classList.add('active');
      document.getElementById('tab-peers').classList.remove('active');
      document.getElementById('view-chat').classList.remove('hidden');
      document.getElementById('view-peers').classList.add('hidden');
    });

    document.getElementById('tab-peers').addEventListener('click', () => {
      document.getElementById('tab-peers').classList.add('active');
      document.getElementById('tab-chat').classList.remove('active');
      document.getElementById('view-peers').classList.remove('hidden');
      document.getElementById('view-chat').classList.add('hidden');
      updatePeerList();
    });

    document.getElementById('btn-refresh-peers').addEventListener('click', updatePeerList);

    log('🏡 OurBackyard Ready. Choose mode to join.');
  </script>
</body>
</html>
